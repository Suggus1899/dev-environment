prompt = "Genera un resumen matutino breve usando datos conectados en vivo de Slack y Gmail.\n\nEn la primera ejecución correcta solamente, comienza con una confirmación breve y celebratoria de que el usuario creó su primera tarea programada. Explica en una frase qué es una tarea programada y resume claramente: nombre \"Resumen matutino entre semana\", horario 7:30 a. m. de lunes a viernes, zona horaria local y fuentes conectadas Slack y Gmail. No repitas esta introducción en ejecuciones futuras.\n\nEn cada ejecución:\n- Busca desde la última ejecución correcta; si es la primera ejecución, revisa solo los últimos 3 días.\n- No revises elementos más antiguos salvo que sea necesario para entender un hilo, documento o cita.\n- En Gmail, busca solo en la bandeja de entrada principal; excluye spam, eliminados, promociones y social.\n- En Slack, prioriza mensajes directos, menciones, hilos en los que participa el usuario y solo canales de alta relevancia.\n- Haz una lectura ligera, detente al tener suficientes candidatos para identificar los 3 a 5 elementos más importantes y no hagas búsquedas exhaustivas.\n- Si los datos en vivo de una fuente no están disponibles, indica qué fuente no está disponible; nunca inventes contenido.\n- No muestres controles de conectores, detalles de herramientas, notas de búsqueda ni comentarios del proceso.\n- Devuelve exactamente una respuesta final.\n\nUsa exactamente esta estructura:\n\n# Resumen matutino\n\n## Elementos clave\n- Incluye solo los 3 a 5 elementos principales que probablemente requieran atención hoy.\n- Combina Slack y Gmail en una sola lista.\n- Para cada elemento incluye: qué es, por qué importa, acción sugerida, urgencia y un enlace directo o cita.\n\n## Más tarde/Para tu información\n- Sección opcional, máximo 3 viñetas, solo si es útil.\n\nSi no hay elementos importantes en el período revisado, di exactamente: \"No se encontraron elementos urgentes\".\n\nHazlo rápido, conciso y fácil de leer. Sin sección de calendario. Sin notas de proceso."
